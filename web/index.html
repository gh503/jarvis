<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#161b1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jarvis">
    <title>Jarvis</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./app.css">
    <script src="./app.js" defer></script>
  </head>
  <body data-connection="checking">
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="topbar">
      <div class="brand">
        <img src="./icon.svg" width="32" height="32" alt="">
        <strong>Jarvis</strong>
      </div>
      <div class="topbar-actions">
        <div class="connection-state" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="connection-label">正在检查</span>
        </div>
        <button id="refresh-button" class="icon-button" type="button" title="刷新连接状态" aria-label="刷新连接状态">↻</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="主导航">
        <nav class="primary-nav">
          <button class="nav-button is-active" type="button" data-view-target="chat" aria-current="page">
            <span aria-hidden="true">◫</span><span>对话</span>
          </button>
          <button class="nav-button" type="button" data-view-target="activity">
            <span aria-hidden="true">◷</span><span>动态</span>
          </button>
          <button class="nav-button" type="button" data-view-target="settings">
            <span aria-hidden="true">⚙</span><span>设置</span>
          </button>
        </nav>
        <div class="conversation-list">
          <div class="section-heading">
            <span>最近对话</span>
            <button class="icon-button" type="button" aria-label="新建对话" title="新建对话" disabled>＋</button>
          </div>
          <p class="empty-list">配对后显示对话</p>
        </div>
        <div class="sidebar-footer">
          <span class="freshness-label">未配对</span>
          <small id="sidebar-status">无同步数据</small>
        </div>
      </aside>

      <main id="main-content" class="main-content">
        <section class="view-panel chat-view is-active" data-view-panel="chat" aria-labelledby="chat-title">
          <header class="view-header">
            <div>
              <p class="eyebrow">移动工作区</p>
              <h1 id="chat-title">新对话</h1>
            </div>
            <span class="freshness-label">未同步</span>
          </header>
          <div class="conversation-empty">
            <div class="empty-symbol" aria-hidden="true">J</div>
            <h2>连接到 Jarvis</h2>
            <p>此设备完成配对后，对话会安全地显示在这里。</p>
            <button id="open-settings-button" class="primary-button" type="button">查看连接状态</button>
          </div>
          <form class="composer" aria-label="消息输入">
            <textarea rows="1" placeholder="配对后即可发送消息" aria-label="消息" disabled></textarea>
            <button class="send-button" type="submit" aria-label="发送消息" title="发送消息" disabled>↑</button>
          </form>
        </section>

        <section class="view-panel" data-view-panel="activity" aria-labelledby="activity-title" hidden>
          <header class="view-header">
            <div>
              <p class="eyebrow">事件流</p>
              <h1 id="activity-title">动态</h1>
            </div>
            <span class="freshness-label">未同步</span>
          </header>
          <div class="plain-empty">
            <h2>暂无动态</h2>
            <p>连接恢复后，新事件会出现在这里。</p>
          </div>
        </section>

        <section class="view-panel" data-view-panel="settings" aria-labelledby="settings-title" hidden>
          <header class="view-header">
            <div>
              <p class="eyebrow">此设备</p>
              <h1 id="settings-title">连接与安装</h1>
            </div>
          </header>
          <div class="settings-list">
            <section class="settings-row" aria-labelledby="gateway-heading">
              <div>
                <h2 id="gateway-heading">Jarvis Gateway</h2>
                <p id="gateway-detail">正在检查本地连接</p>
              </div>
              <span id="gateway-value" class="value-label">检查中</span>
            </section>
            <section class="settings-row" aria-labelledby="device-heading">
              <div>
                <h2 id="device-heading">设备身份</h2>
                <p>尚未向此浏览器签发凭据</p>
              </div>
              <span class="value-label is-muted">未配对</span>
            </section>
            <section class="settings-row" aria-labelledby="sync-heading">
              <div>
                <h2 id="sync-heading">数据状态</h2>
                <p id="last-check">尚未成功连接</p>
              </div>
              <span class="value-label is-warning">不可用</span>
            </section>
            <section class="settings-row" aria-labelledby="install-heading">
              <div>
                <h2 id="install-heading">安装 Jarvis</h2>
                <p id="install-detail">可从浏览器菜单添加到主屏幕</p>
              </div>
              <button id="install-button" class="secondary-button" type="button" hidden>安装</button>
            </section>
          </div>
        </section>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="主导航">
      <button class="mobile-nav-button is-active" type="button" data-view-target="chat" aria-current="page"><span aria-hidden="true">◫</span><span>对话</span></button>
      <button class="mobile-nav-button" type="button" data-view-target="activity"><span aria-hidden="true">◷</span><span>动态</span></button>
      <button class="mobile-nav-button" type="button" data-view-target="settings"><span aria-hidden="true">⚙</span><span>设置</span></button>
    </nav>
  </body>
</html>
