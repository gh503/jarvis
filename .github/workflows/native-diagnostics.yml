name: Native snapshot and shortcut diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run isolated snapshot boundary, CLI and bounded diagnostics
        run: node --experimental-transform-types --test --test-concurrency=1 test/native-snapshot-diagnostics.test.ts test/native-integration-snapshot.test.ts test/native-integration-snapshot-cli.test.ts
  shortcut:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe Unicode shell-link target handling in temporary directories
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('jarvis-probe-' + [Guid]::NewGuid())
          New-Item -ItemType Directory -Path $root | Out-Null
          $node = (Get-Command node.exe).Source
          $unicode = [string][char]0x4E2D + [char]0x6587
          $names = @('plain', 'with spaces', $unicode, "package ' & `$ folder", ($unicode + " package ' & `$ folder"))
          $requiredFailures = 0
          foreach ($name in $names) {
            $dir = Join-Path $root $name
            New-Item -ItemType Directory -Path $dir | Out-Null
            $target = Join-Path $dir 'node.exe'
            Copy-Item -LiteralPath $node -Destination $target
            foreach ($quoted in @($false, $true)) {
              try {
                $out = Join-Path $dir ("probe-$quoted.lnk")
                $link = (New-Object -ComObject WScript.Shell).CreateShortcut($out)
                $value = if ($quoted) { '"' + $target + '"' } else { $target }
                $link.TargetPath = $value
                $link.Save()
                $loaded = (New-Object -ComObject WScript.Shell).CreateShortcut($out)
                $exact = [string]::Equals($loaded.TargetPath, $target, [StringComparison]::Ordinal)
                if (!$quoted -and !$exact) { $requiredFailures++ }
                Write-Host ("RESULT name={0} quoted={1} exact={2}" -f $name, $quoted, $exact)
              } catch {
                if (!$quoted) { $requiredFailures++ }
                Write-Host ("FAIL name={0} quoted={1}" -f $name, $quoted)
              }
            }
          }
          # Only exact directory allocated by this step, below the runner's temp root.
          if ((Split-Path -Parent $root) -ne $env:RUNNER_TEMP) { throw 'Unsafe probe cleanup' }
          Remove-Item -LiteralPath $root -Recurse -Force
          if ($requiredFailures -ne 0) { throw 'Unquoted shortcut target round-trip failed' }
