name: Native platforms
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Native lifecycle and configuration acceptance
        run: node --experimental-transform-types --test test/config.test.ts test/runtime-lifecycle.test.ts test/native-actions.test.ts test/worker-utf8.test.ts test/packaging.test.ts test/private-directory.test.ts test/backup-portability.test.ts test/native-install.test.ts test/doctor.test.ts test/browser-capture.test.ts test/browser-capture-frontend.test.ts test/browser-capture-integration.test.ts test/model-redirects.test.ts test/native-privacy.test.ts test/native-update.test.ts test/windows-notification.test.ts test/voice-runtime.test.ts
      - name: Build self-contained native distribution
        run: npm run package
      - name: Verify extracted bundle without global Node
        run: node --experimental-transform-types --test test/packaged-runtime.test.ts
        env:
          JARVIS_PACKAGE_ARCHIVE: auto
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-native-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
