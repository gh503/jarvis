name: Native platforms
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build pinned native filesystem helper
        timeout-minutes: 30
        run: npm run native:build
      - name: Native filesystem protocol and handle acceptance
        timeout-minutes: 3
        run: node --experimental-transform-types --test test/native-filesystem.test.ts test/native-skill-tools.test.ts test/native-file-tools.test.ts test/native-read-settings.test.ts
        env:
          JARVIS_NATIVE_HELPER_REQUIRED: '1'
      - name: Native lifecycle and configuration acceptance
        run: node --experimental-transform-types --test --test-concurrency=2 test/config.test.ts test/cli-lifecycle.test.ts test/native-state-snapshot.test.ts test/stopped-data-scope.test.ts test/native-recovery-set.test.ts test/native-recovery-set-cli.test.ts test/native-snapshot-cli.test.ts test/external-config.test.ts test/native-config-snapshot.test.ts test/native-config-snapshot-cli.test.ts test/external-config-file-protection.test.ts test/native-config-launch.test.ts test/runtime-lifecycle.test.ts test/lifecycle-lock-files.test.ts test/native-actions.test.ts test/worker-utf8.test.ts test/packaging.test.ts test/private-directory.test.ts test/backup-portability.test.ts test/native-install.test.ts test/native-install-lock.test.ts test/native-install-intent.test.ts test/native-install-intent-store.test.ts test/native-install-reconcile.test.ts test/native-install-diagnose.test.ts test/native-install-diagnose-cli.test.ts test/native-integration-snapshot.test.ts test/native-integration-snapshot-cli.test.ts test/native-snapshot-diagnostics.test.ts test/doctor.test.ts test/browser-capture.test.ts test/browser-capture-frontend.test.ts test/browser-capture-integration.test.ts test/model-redirects.test.ts test/native-privacy.test.ts test/native-update.test.ts test/native-update-journal.test.ts test/windows-notification.test.ts test/voice-runtime.test.ts
      - name: Build self-contained native distribution
        run: npm run package
      - name: Verify extracted bundle without global Node
        run: node --experimental-transform-types --test test/packaged-runtime.test.ts
        env:
          JARVIS_PACKAGE_ARCHIVE: auto
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-native-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
