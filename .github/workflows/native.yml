name: Native platforms
on:
  push:
    # Skip push-only evidence updates; code/workflow changes still run this matrix.
    # Keep PR runs unconditional so required checks are never left pending.
    paths-ignore:
      - 'docs/native-release-pipeline.md'
      - 'docs/native-install-intent.md'
      - 'docs/native-install.md'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-transactions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        group: [storage, inspection, inspection-0, inspection-1, inspection-2, inspection-3, crash, retirement, retirement-cli, uninstall-0, uninstall-1, uninstall-2, uninstall-3, uninstall-4, uninstall-5, uninstall-6, uninstall-7, completed-uninstall-cli, write-gate-0, write-gate-1, write-gate-2, write-gate-3, completion-0, completion-1, completion-2, completion-3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify transaction codecs and storage
        if: matrix.group == 'storage'
        run: node --experimental-transform-types --test --test-concurrency=2 test/native-install-transaction.test.ts test/native-install-transaction-store.test.ts test/native-install-transaction-ack.test.ts test/native-install-transaction-ack-store.test.ts test/native-install-transaction-completion.test.ts test/native-install-transaction-completion-partition.test.ts test/native-install-transaction-inspection-partition.test.ts test/native-install-prepared-write-gate-partition.test.ts test/native-install-completed-uninstall-partition.test.ts
      - name: Verify transaction inspection CLI
        if: matrix.group == 'inspection'
        run: node --experimental-transform-types --test --test-concurrency=2 test/native-install-transaction-inspect-cli.test.ts
      - name: Verify transaction inspection case partition
        if: startsWith(matrix.group, 'inspection-')
        env:
          JARVIS_TEST_INSPECTION_PARTITION: ${{ fromJSON('{"inspection-0":"0","inspection-1":"1","inspection-2":"2","inspection-3":"3"}')[matrix.group] }}
        run: node --experimental-transform-types --test --test-concurrency=1 test/native-install-transaction-inspect.test.ts
      - name: Verify persisted transaction process interruption
        if: matrix.group == 'crash'
        run: node --experimental-transform-types --test --test-concurrency=1 test/native-install-transaction-crash.test.ts
      - name: Verify bounded preparation retirement
        if: matrix.group == 'retirement'
        run: node --experimental-transform-types --test --test-concurrency=1 test/native-install-preparation-retire.test.ts
      - name: Verify preparation retirement CLI
        if: matrix.group == 'retirement-cli'
        run: node --experimental-transform-types --test --test-concurrency=1 test/native-install-preparation-retire-cli.test.ts
      - name: Verify completed generation uninstall partition
        if: startsWith(matrix.group, 'uninstall-')
        env:
          JARVIS_TEST_UNINSTALL_PARTITION: ${{ fromJSON('{"uninstall-0":"0","uninstall-1":"1","uninstall-2":"2","uninstall-3":"3","uninstall-4":"4","uninstall-5":"5","uninstall-6":"6","uninstall-7":"7"}')[matrix.group] }}
        run: node --experimental-transform-types --test --test-concurrency=1 test/native-install-completed-uninstall.test.ts
      - name: Verify completed generation uninstall CLI
        if: matrix.group == 'completed-uninstall-cli'
        run: node --experimental-transform-types --test --test-concurrency=1 test/native-install-completed-uninstall-cli.test.ts
      - name: Verify prepared writer barrier partition
        if: startsWith(matrix.group, 'write-gate-')
        env:
          JARVIS_TEST_WRITE_GATE_PARTITION: ${{ fromJSON('{"write-gate-0":"0","write-gate-1":"1","write-gate-2":"2","write-gate-3":"3"}')[matrix.group] }}
        run: node --experimental-transform-types --test --test-concurrency=1 test/native-install-prepared-write-gate.test.ts
      - name: Verify completion store partition
        if: startsWith(matrix.group, 'completion-')
        env:
          JARVIS_TEST_COMPLETION_PARTITION: ${{ fromJSON('{"completion-0":"0","completion-1":"1","completion-2":"2","completion-3":"3"}')[matrix.group] }}
        run: node --experimental-transform-types --test --test-concurrency=1 test/native-install-transaction-completion-store.test.ts
  native-core:
    needs: native-transactions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build pinned native filesystem helper
        timeout-minutes: 30
        run: npm run native:build
      - name: Native filesystem protocol and handle acceptance
        timeout-minutes: 3
        run: node --experimental-transform-types --test test/native-filesystem.test.ts test/native-skill-tools.test.ts test/native-file-tools.test.ts test/native-read-settings.test.ts
        env:
          JARVIS_NATIVE_HELPER_REQUIRED: '1'
      - name: Native lifecycle and configuration acceptance
        timeout-minutes: 20
        run: node --experimental-transform-types --test --test-concurrency=2 test/config.test.ts test/cli-lifecycle.test.ts test/native-state-snapshot.test.ts test/stopped-data-scope.test.ts test/native-recovery-set.test.ts test/native-recovery-set-cli.test.ts test/native-snapshot-cli.test.ts test/external-config.test.ts test/native-config-snapshot.test.ts test/native-config-snapshot-cli.test.ts test/external-config-file-protection.test.ts test/native-config-launch.test.ts test/runtime-lifecycle.test.ts test/lifecycle-lock-files.test.ts test/native-actions.test.ts test/worker-utf8.test.ts test/packaging.test.ts test/private-directory.test.ts test/backup-portability.test.ts test/native-integration-snapshot.test.ts test/native-integration-snapshot-cli.test.ts test/native-snapshot-diagnostics.test.ts test/native-snapshot-phases.test.ts test/doctor.test.ts test/browser-capture.test.ts test/browser-capture-frontend.test.ts test/browser-capture-integration.test.ts test/model-redirects.test.ts test/native-privacy.test.ts test/native-update.test.ts test/native-update-journal.test.ts test/windows-notification.test.ts test/voice-runtime.test.ts
      - name: Native installation and legacy intent acceptance
        timeout-minutes: 20
        run: node --experimental-transform-types --test --test-concurrency=2 test/native-install.test.ts test/native-install-lock.test.ts test/native-install-intent.test.ts test/native-install-intent-store.test.ts test/native-install-reconcile.test.ts test/native-install-diagnose.test.ts test/native-install-diagnose-cli.test.ts
      - name: Build self-contained native distribution
        run: npm run package
      - name: Verify extracted bundle without global Node
        run: node --experimental-transform-types --test test/packaged-runtime.test.ts
        env:
          JARVIS_PACKAGE_ARCHIVE: auto
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-native-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
