name: Native update acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pair:
    name: v75 to v76 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Builtins only: downloads the two published native releases, never builds them.
      - name: Verify fixed release pair using baseline bundled runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-transform-types scripts/verify-native-release-pair.ts
      - name: Upload acceptance report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-update-acceptance-${{ matrix.os }}
          path: native-update-acceptance-report.json
          if-no-files-found: warn
          retention-days: 14
