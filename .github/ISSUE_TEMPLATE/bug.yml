name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: Remove API keys, transcripts, reminders, audit data, and device identifiers before submitting.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS, Node.js, and Jarvis commit or version.
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Safety impact
      options:
        - None known
        - Data exposure
        - Unauthorized action
        - Network exposure
        - Data loss
        - Other
    validations:
      required: true
