<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b0f">
  <title>配对 · Jarvis</title>
  <link rel="icon" href="/icons/jarvis.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/pair.css">
</head>
<body>
  <main class="pair-shell">
    <a class="pair-brand" href="/" aria-label="Jarvis">
      <span class="pair-orb" aria-hidden="true"></span>
      <span>JARVIS</span>
    </a>
    <p class="eyebrow">DEVICE PAIRING</p>
    <h1>把这台设备<br>接到你的 Jarvis。</h1>
    <p class="pair-copy">在已登录的设备上打开“设置 → 设备 → 生成配对码”，输入六位数字。配对码 5 分钟内有效，只能使用一次。</p>
    <form id="pair-form" autocomplete="off">
      <label>配对码
        <input id="pair-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autofocus>
      </label>
      <label>设备名称
        <input id="pair-name" name="name" maxlength="80" placeholder="我的手机 / 办公电脑">
      </label>
      <button class="pair-submit" type="submit">配对并进入</button>
      <p class="pair-status" id="pair-status" role="status" aria-live="polite"></p>
    </form>
    <p class="pair-foot">配对只在本机生成凭据；令牌以 HttpOnly Cookie 保存，不会写入网址历史。你可以随时在设置里撤销设备。</p>
  </main>
  <script src="/pair.js"></script>
</body>
</html>
